[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xspecsampler"
version = "0.1.0.dev0"
description = "Parallel PyXspec likelihoods, multistart LM fits, quality-gated pocoMC posteriors and evidences for XSPEC models, and HEASARC archive search"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Kshitij Duraphe" }]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
# pocoMC's Sampler API changed in 1.3; the package is written against 1.2.x.
sampler = ["pocomc>=1.2,<1.3", "torch>=2.0"]
plot = ["matplotlib>=3.5"]
archive = ["astropy>=5.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "xspec: needs HEASoft/PyXspec (skipped when unavailable)",
    "network: queries HEASARC (skipped when unreachable)",
]
